<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>한국 사회의 인지적 특성과 평가 패턴에 관한 연구 - 모집 마감</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #1a3050;
      --navy-pale: #eaf0f9;
      --gold: #b8870b;
      --bg: #f5f0e6;
      --surface: #ffffff;
      --text: #1c1c1c;
      --muted: #666666;
      --border: #ddd5c0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 90% 60% at 10% 5%, rgba(26,48,80,.06) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 95%, rgba(184,135,11,.05) 0%, transparent 55%);
      color: var(--text);
      font-family: "Noto Sans KR", sans-serif;
    }

    main {
      width: min(760px, 100%);
      padding: 44px 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 34px rgba(26,48,80,.13);
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 18px;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--navy-pale);
      color: var(--navy);
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 18px;
      color: var(--navy);
      font-family: "Noto Serif KR", serif;
      font-size: clamp(25px, 4vw, 34px);
      line-height: 1.35;
    }

    p {
      margin: 0 auto 12px;
      max-width: 620px;
      font-size: 16px;
      line-height: 1.8;
    }

    .muted {
      color: var(--muted);
      font-size: 15px;
    }

    .contact {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    a {
      color: var(--navy);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">모집 마감</span>
    <h1>연구 참여자 모집이 마감되었습니다.</h1>
    <p>
      한국 사회의 인지적 특성과 평가 패턴에 관한 연구에 관심을 가져주시고
      참여해 주셔서 감사합니다.
    </p>
    <p class="muted">
      현재 추가 응답은 받고 있지 않습니다.
    </p>
    <div class="contact">
      문의: 최지영<br>
      이화여자대학교 사회과학대학 심리학과 박사과정<br>
      <a href="mailto:jchoe90@ewhain.net">jchoe90@ewhain.net</a>
    </div>
  </main>
</body>
</html>
