<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IAT - 성별-재능 고정관념 연구</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />

  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-instructions@1.1.3"></script>

  <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.2"></script>

  <script src="./experiment.js"></script>

  <style>
    /* ──────────────────────────────────────────────
       IAT Experiment · Design System
       Theme: Refined Academic
       Palette: Warm Cream · Navy · Academic Gold
    ────────────────────────────────────────────── */

    :root {
      --navy:          #1a3050;
      --navy-mid:      #1f3d65;
      --navy-light:    #2e5490;
      --navy-pale:     #eaf0f9;
      --gold:          #b8870b;
      --gold-pale:     #fdf6e3;
      --bg:            #f5f0e6;
      --surface:       #ffffff;
      --text:          #1c1c1c;
      --text-muted:    #6a6a6a;
      --border:        #ddd5c0;
      --border-light:  #ece7da;
      --error:         #c0392b;
      --shadow-sm:     0 2px 10px rgba(26,48,80,.08);
      --shadow-md:     0 6px 28px rgba(26,48,80,.12);
      --shadow-lg:     0 12px 48px rgba(26,48,80,.16);
      --radius:        10px;
      --radius-sm:     6px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    /* ── Page Background ── */
    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 90% 60% at 10% 5%,  rgba(26,48,80,.06)   0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 95%, rgba(184,135,11,.05)  0%, transparent 55%);
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
      margin: 0;
    }

    /* ── jsPsych Core Overrides ── */
    .jspsych-display-element  { background: transparent !important; }
    .jspsych-content-wrapper  { background: transparent !important; }

    .jspsych-content {
      background: transparent !important;
      max-width: 900px !important;
      padding: 24px 20px 96px !important;
    }

    /* ── Buttons ── */
    .jspsych-btn {
      font-family:    'Noto Sans KR', sans-serif !important;
      font-size:      15px !important;
      font-weight:    500 !important;
      background:     var(--navy) !important;
      color:          #fff !important;
      border:         none !important;
      border-radius:  var(--radius) !important;
      padding:        13px 44px !important;
      cursor:         pointer !important;
      transition:     background 0.18s, transform 0.15s, box-shadow 0.18s !important;
      box-shadow:     0 4px 0 rgba(0,0,0,.22), 0 2px 12px rgba(26,48,80,.22) !important;
      letter-spacing: 0.4px !important;
    }

    .jspsych-btn:hover {
      background:  var(--navy-mid) !important;
      transform:   translateY(-2px) !important;
      box-shadow:  0 6px 0 rgba(0,0,0,.18), 0 4px 20px rgba(26,48,80,.28) !important;
    }

    .jspsych-btn:active {
      transform:  translateY(1px) !important;
      box-shadow: 0 2px 0 rgba(0,0,0,.2) !important;
    }

    /* ── Instruction / Consent Card ── */
    .inst-card {
      background:    var(--surface);
      border-radius: var(--radius);
      padding:       40px 52px;
      box-shadow:    var(--shadow-md);
      border:        1px solid var(--border);
      font-size:     15px;
      line-height:   1.9;
      color:         var(--text);
    }

    .inst-card h2 {
      font-family:   'Noto Serif KR', serif;
      font-size:     19px;
      font-weight:   700;
      color:         var(--navy);
      text-align:    center;
      padding-bottom: 14px;
      margin:        0 0 24px;
      border-bottom: 2px solid var(--navy-pale);
    }

    .inst-card h3 {
      font-family:   'Noto Serif KR', serif;
      font-size:     14px;
      font-weight:   700;
      color:         var(--navy);
      margin:        22px 0 5px;
      display:       flex;
      align-items:   center;
      gap:           8px;
    }

    .inst-card h3::before {
      content:       '';
      display:       inline-block;
      width:         3px;
      height:        13px;
      background:    var(--gold);
      border-radius: 2px;
      flex-shrink:   0;
    }

    .inst-card p  { margin: 0 0 9px; color: #363636; }
    .inst-card ul { padding-left: 20px; margin: 0 0 9px; color: #363636; }
    .inst-card li { margin-bottom: 4px; }

    /* info / consent highlight boxes */
    .info-box {
      background:    var(--navy-pale);
      border-left:   4px solid var(--navy);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding:       11px 16px;
      font-size:     14px;
      line-height:   1.85;
      margin:        8px 0 10px;
      color:         #2a3a5a;
    }

    .consent-box {
      border:        2px solid var(--navy);
      border-radius: var(--radius);
      padding:       16px 22px;
      margin-top:    24px;
      background:    var(--navy-pale);
      text-align:    center;
      font-weight:   700;
      font-size:     15px;
      color:         var(--navy);
    }

    .contact-table {
      width:           100%;
      border-collapse: collapse;
      font-size:       14px;
      margin-bottom:   8px;
    }

    .contact-table td {
      padding:    8px 12px;
      border:     1px solid var(--border);
      color:      #333;
    }

    .contact-table tr:nth-child(odd) td { background: var(--navy-pale); }

    /* ── IAT Trial: Top Label Bar ── */
    .iat-label-bar {
      position:           fixed;
      top:                0;
      left:               0;
      right:              0;
      display:            flex;
      justify-content:    space-between;
      align-items:        center;
      padding:            14px 56px;
      background:         rgba(245,240,230,.94);
      backdrop-filter:    blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom:      1px solid var(--border);
      box-sizing:         border-box;
      z-index:            100;
    }

    .iat-label-inner {
      display:      inline-flex;
      align-items:  center;
      gap:          10px;
    }

    /* Right-side label: key badge on the right */
    .iat-label-right .iat-label-inner {
      flex-direction: row-reverse;
    }

    .iat-key-badge {
      display:         inline-flex;
      align-items:     center;
      justify-content: center;
      width:           36px;
      height:          36px;
      background:      linear-gradient(175deg, #2a4a75 0%, var(--navy) 100%);
      color:           #fff;
      font-family:     'Noto Sans KR', sans-serif;
      font-weight:     700;
      font-size:       16px;
      border-radius:   var(--radius-sm);
      box-shadow:      0 3px 0 #0d1f38, 0 1px 5px rgba(0,0,0,.3);
      flex-shrink:     0;
    }

    .iat-cat-name {
      font-family: 'Noto Sans KR', sans-serif;
      font-size:   17px;
      font-weight: 700;
      color:       var(--navy);
      line-height: 1.3;
    }

    .iat-cat-sep {
      font-weight: 300;
      color:       #bbb;
      padding:     0 1px;
    }

    /* ── IAT Stimulus Word ── */
    .iat-stimulus {
      animation:    fadeInStim 0.1s ease-out;
      font-family:  'Noto Serif KR', serif;
      font-weight:  700;
      letter-spacing: 4px;
      color:        var(--text);
      text-align:   center;
    }

    @keyframes fadeInStim {
      0%   { opacity: 0.15; transform: scale(0.92) translateY(6px); }
      100% { opacity: 1;    transform: scale(1)    translateY(0); }
    }

    /* ── Error X ── */
    .iat-error-x {
      text-align: center;
      margin-top: 6px;
      color:      var(--error);
      animation:  popIn 0.15s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes popIn {
      0%   { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }

    /* ── Spacebar Hint ── */
    #jspsych-spacebar-hint {
      display:        inline-block;
      font-family:    'Noto Sans KR', sans-serif;
      font-size:      14px;
      font-weight:    500;
      color:          var(--navy);
      background:     var(--surface);
      padding:        11px 36px;
      border-radius:  var(--radius);
      border:         2px solid var(--navy);
      box-shadow:     var(--shadow-sm);
      letter-spacing: 0.6px;
    }

    /* Default hidden state for spacebar hint animation */
    #jspsych-spacebar-hint.hint-delayed {
      opacity:   0;
      animation: fadeInHint 0.7s ease-in 1.5s forwards;
    }

    @keyframes fadeInHint {
      to { opacity: 1; }
    }

    /* ── Progress Indicator ── */
    .progress-wrap {
      display:     flex;
      align-items: center;
      gap:         12px;
      margin-bottom: 20px;
    }

    .progress-steps {
      display: flex;
      gap:     5px;
    }

    .progress-step {
      width:         28px;
      height:        4px;
      border-radius: 2px;
      background:    var(--border);
      transition:    background 0.3s;
    }

    .progress-step.done    { background: var(--navy); }
    .progress-step.current { background: var(--gold); }

    .progress-label {
      font-size:   12px;
      color:       var(--text-muted);
      font-weight: 500;
    }

    /* ── Task Guide Box ── */
    .task-guide {
      background:    var(--navy-pale);
      border-left:   4px solid var(--navy);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding:       13px 18px;
      font-size:     14px;
      line-height:   1.9;
      margin-top:    18px;
      color:         #333;
    }

    /* ── Survey Preamble ── */
    .survey-preamble {
      font-family:   'Noto Serif KR', serif;
      font-size:     17px;
      font-weight:   700;
      color:         var(--navy);
      padding-bottom: 12px;
      margin-bottom: 4px;
      border-bottom: 2px solid var(--navy-pale);
    }

    .survey-subtitle {
      display:     block;
      font-family: 'Noto Sans KR', sans-serif;
      font-size:   14px;
      font-weight: 400;
      color:       var(--text-muted);
      margin-top:  5px;
    }

    /* ── Survey Form Overrides ── */
    .jspsych-survey-likert-statement {
      font-family: 'Noto Sans KR', sans-serif !important;
      font-size:   15px !important;
      line-height: 1.85 !important;
      color:       var(--text) !important;
    }

    .jspsych-survey-likert-opts td {
      font-family: 'Noto Sans KR', sans-serif !important;
      font-size:   12px !important;
      color:       var(--text-muted) !important;
    }

    .jspsych-survey-multi-choice-text,
    .jspsych-survey-text-statement {
      font-family: 'Noto Sans KR', sans-serif !important;
      font-size:   15px !important;
      line-height: 1.85 !important;
    }
  </style>
</head>
<body></body>
</html>
